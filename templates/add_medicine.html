<!DOCTYPE html>
<html>

<head>

    <title>Add Medicine</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>💊 Add Medicine</h1>

    <form method="POST">

        <label>Medicine Name</label>

        <input
            type="text"
            name="name"
            placeholder="Example: Paracetamol"
            required
        >

        <label>Dosage</label>

        <input
            type="text"
            name="dosage"
            placeholder="Example: 500 mg"
            required
        >

        <label>Reminder Time</label>

        <input
            type="time"
            name="time"
            required
        >

        <label>Start Date</label>

        <input
            type="date"
            name="start_date"
            required
        >

        <label>End Date</label>

        <input
            type="date"
            name="end_date"
            required
        >

        <label>Instructions</label>

        <textarea
            name="instructions"
            placeholder="Example: Take after food">
        </textarea>

        <button type="submit">
            Save Medicine
        </button>

    </form>

    <a href="{{ url_for('index') }}" class="back">
        ← Back to Home
    </a>

</div>

</body>

</html>
